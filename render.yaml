services:
  # 1. Combined Backend + Engine Service (Docker)
  - type: web
    name: crypto-combined
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-db
          property: connectionString
      - key: RENDER
        value: true
    autoDeploy: false

  # 2. Frontend Service (Web Service)
  - type: web
    name: crypto-frontend
    env: node
    buildCommand: 'cd frontend && npm install && npm run build'
    startCommand: 'cd frontend && npx serve@latest out -p $PORT -s'
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: crypto-combined
          property: host
    autoDeploy: false

databases:
  - name: crypto-db
    plan: free
    databaseName: crypto_db
    user: crypto_user
